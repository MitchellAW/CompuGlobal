[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "compuglobal"
authors = [
    {name = "MitchellAW"},
]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.13"
dynamic = ["version", "description"]
dependencies = [
    "aiohttp>=3.13.0", "pydantic>=2.13.0"
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
keywords = [
    "The Simpsons", "Futurama", "Rick and Morty", "West Wing", "Frinkiac", "Morbotron", "Master of all Science", "Capital Beat", "API", "API Wrapper", "CompuGlobal", "CompuGlobalHyperMegaNet", "CGHMC"
]

[project.urls]
Documentation = "https://compuglobal.readthedocs.io/en/latest/"
Source = "https://github.com/MitchellAW/CompuGlobal"

[project.scripts]
flit = "flit:main"
