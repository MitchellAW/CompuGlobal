[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "compuglobal"
authors = [
    {name = "MitchellAW"},
]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.13"
dynamic = ["version", "description"]
dependencies = [
    "aiohttp>=3.13.0", "pydantic>=2.13.0"
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
keywords = [
    "The Simpsons", "Futurama", "Rick and Morty", "West Wing", "Frinkiac", "Morbotron", "Master of all Science", "Capital Beat", "API", "API Wrapper", "CompuGlobal", "CompuGlobalHyperMegaNet", "CGHMC"
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.13",
]
docs = [
    "enum-tools[sphinx]>=0.13.0",
    "sphinx<9.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-trio>=1.2.0",
]
test = [
    "aiointercept>=0.1.3",
    "hypothesis>=6.152.7",
    "inline-snapshot>=0.33.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Documentation = "https://compuglobal.readthedocs.io/en/latest/"
Source = "https://github.com/MitchellAW/CompuGlobal"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["CPY001"]

[tool.ruff.per-file-ignores]
"examples/*" = ["INP001", "T201", "ANN201", "D103", "CPY001"]
"docs/*" = ["A001", "INP001", "D100", "CPY001"]
"tests/*" = ["S101", "D103", "PLR2004", "S311"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
